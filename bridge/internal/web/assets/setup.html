<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MemoAlarm Bridge · Setup</title><link rel="stylesheet" href="/style.css"><script type="module" src="/setup.js"></script></head>
<body><main class="installer"><header><p class="eyebrow">MEMOALARM BRIDGE</p><h1 id="title">Your PC, ready.</h1><select id="language" aria-label="Language"><option value="en">English</option><option value="ko">한국어</option></select></header>
<section id="approval" class="card"><h2 id="approve-title">Open local setup</h2><p id="approve-copy">Approve only the local link opened by your downloaded Bridge.</p><button id="approve">Approve this session</button></section>
<section id="controls" hidden><article class="card"><h2 id="plan-title">Review the installation</h2><p id="signature" class="notice"></p><pre id="plan" class="mono"></pre><label class="check"><input id="startup" type="checkbox"><span id="startup-label">Start automatically when I sign in</span></label><p id="network" class="muted"></p><div class="actions"><button id="install">Install / update</button><button id="run" class="secondary">Run without installing</button><button id="launch" class="secondary">Open installed app</button><button id="refresh" class="secondary">Check again</button></div></article>
<article class="card"><h2 id="recovery-title">Recovery and removal</h2><p id="recovery-copy"></p><div class="actions"><button id="stop" class="secondary">Stop this Bridge for update</button><button id="uninstall" class="secondary">Uninstall · keep data</button></div></article></section>
<p id="message" role="status" aria-live="polite"></p><p id="leave" class="muted"></p></main></body></html>
